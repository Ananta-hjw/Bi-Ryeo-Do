name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'Story/**'
      - 'Docs/**'
      - '*.md'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Unity Android image is ~12 GB uncompressed; the default runner disk fills up while pulling it
      # ("no space left on device", exit code 125). Remove unused preinstalled tools first.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      # Needs repository secrets UNITY_LICENSE (contents of the .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
      # See https://game.ci/docs/github/activation
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: BiRyeoDo.Editor.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: BiRyeoDo-apk
          path: build/Android/BiRyeoDo.apk
