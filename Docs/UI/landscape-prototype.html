<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비뢰도 · 가로 화면 구성 시안</title>
<style>
:root{color-scheme:dark;--ink:#0c2022;--panel:#122b2d;--line:#58634c;--gold:#d5bd80;--paper:#f2ead5;--muted:#acbcb4;--red:#853e33;--blue:#8ecfff;--jade:#70b29c}
*{box-sizing:border-box}body{margin:0;background:#071415;color:var(--paper);font:clamp(14px,1.15vw,21px)/1.5 system-ui,"Noto Sans KR",sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#173234;border-radius:3px;padding:.55em .8em;min-height:44px}button:hover{border-color:var(--gold);background:#254644}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}button.active{border-color:var(--gold);color:var(--gold);background:#2a4138}.primary{background:var(--red);border-color:#ba7861}.muted,small{color:var(--muted)}.gold{color:var(--gold)}.new{color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-family:serif;font-size:clamp(26px,3vw,48px);letter-spacing:.12em}h2{font-size:1.3em;color:var(--gold)}h3{font-size:1em;color:var(--gold);margin-bottom:.6em}.sample{height:30px;background:#324136;color:#e1e6cc;text-align:center;font-size:13px;line-height:30px}.app{height:calc(100dvh - 30px);min-width:960px;display:grid;grid-template-rows:64px 1fr 64px;background:radial-gradient(ellipse at 20% 60%,#36544980,transparent 55%),linear-gradient(100deg,#071517e6,#10282be6),url('../../Assets/_Project/Resources/Art/Backgrounds/stage_01.png') center/cover}.top{display:flex;align-items:center;justify-content:space-between;padding:0 2.2vw;border-bottom:1px solid var(--line);background:#071719cf}.brand{font:700 28px serif;color:var(--gold);letter-spacing:.22em}.resources{display:flex;gap:1.6em}.view{min-height:0;padding:16px 2.2vw;overflow:hidden}.hidden{display:none!important}.nav{display:flex;gap:10px;align-items:center;justify-content:center;border-top:1px solid var(--line);background:#08191ce8}.nav button{min-width:140px;border-color:transparent;background:transparent}.nav button.active{border-bottom:3px solid var(--gold);background:#d5bd8012}.home-grid{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);height:100%;gap:12px}.hero-art{position:relative;min-height:0;overflow:hidden;border:1px solid #73826a44;border-radius:4px;background:radial-gradient(ellipse,#587e6a44,transparent 70%)}.hero-art img{height:100%;width:100%;object-fit:contain;object-position:center bottom;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}.hero-caption{position:absolute;bottom:0;left:0;right:0;padding:2em 1.5em 1em;background:linear-gradient(transparent,#071719 42%)}.seal{display:inline-block;padding:.2em .55em;border:1px solid #b8755d;color:#e5b29d;margin-bottom:.5em}.home-menu{padding:12px 0 12px 18px;display:flex;flex-direction:column;gap:14px;justify-content:center}.home-menu p{margin-bottom:.6em}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{text-align:left;padding:1em 1.3em;min-height:110px;background:linear-gradient(110deg,#1c3633,#0d2529);position:relative}.tile strong{display:block;font:700 1.7em serif;color:var(--gold)}.tile small{display:block;margin-top:.4em}.tile.wide{grid-column:span 2;min-height:130px;background:linear-gradient(105deg,#5c382c,#173333)}.tile .arrow{position:absolute;right:1.2em;top:1em;color:var(--gold);font-size:1.5em}.quick{display:flex;gap:10px;margin-top:4px}.quick button{flex:1}.companions{display:grid;grid-template-rows:82px 1fr;gap:12px;height:100%}.roster{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.person{padding:5px 9px;text-align:left;display:flex;align-items:center;gap:10px;background:#102629}.person img{width:52px;height:64px;object-fit:cover;object-position:center 20%;border-radius:50%;background:#263f39}.person strong,.person small{display:block}.workspace{display:grid;grid-template-columns:minmax(0,25fr) minmax(0,75fr);gap:18px;min-height:0}.workspace .hero-caption{padding-top:3em}.workspace .hero-caption h1{font-size:2em}.manager{display:grid;grid-template-rows:48px 1fr;min-height:0;background:#102326e8;border:1px solid var(--line);border-radius:4px}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;background:transparent}.tabs button.active{background:#70413380;border-bottom:3px solid #d89070;color:var(--paper)}.tabbody{padding:16px;min-height:0;overflow:auto;scrollbar-color:#8d9b78 #162b2b}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid #63725580;background:#0b2022;padding:14px}.stat strong{display:block;color:var(--paper);font-size:1.6em}.row{display:flex;justify-content:space-between;align-items:center;padding:.8em;border-bottom:1px solid #63725550}.setbar{padding:8px 12px;background:#34473855;border-left:3px solid var(--gold);margin-bottom:12px;color:var(--gold)}.gear-columns{display:grid;grid-template-columns:21% 1fr 30%;gap:12px;min-height:300px}.gear-columns>*{min-width:0}.slots{display:flex;flex-direction:column;gap:7px}.slots button{text-align:left;padding:.45em .6em}.slots small{display:block;font-size:.75em}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}.item{text-align:left;display:flex;flex-direction:column;align-items:start;padding:10px;gap:5px}.item strong{color:#eabf80}.item small{font-size:.85em}.detail{border:1px solid #687457;background:#07191c;padding:12px}.detail p{margin:.65em 0}.detail button{width:100%;margin-top:8px}.training{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.training-box{padding:18px;background:#0a2022;border:1px solid var(--line)}.training-box p{margin:12px 0}.level{font-size:2.5em;color:var(--gold)}.milestones{display:flex;justify-content:space-between;margin:18px 0;gap:6px}.milestones span{padding:8px;border:1px solid var(--line);text-align:center;font-size:.8em}.milestones .done{color:var(--jade);border-color:var(--jade)}.note{padding:12px;margin-top:14px;border-left:3px solid var(--jade);background:#19322d}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:3;background:#29483f;color:#fff2c7;border:1px solid var(--gold);padding:12px 24px;max-width:80vw;box-shadow:0 8px 30px #0008;pointer-events:none}.modal-back{position:fixed;inset:30px 0 0;z-index:4;display:grid;place-items:center;background:#000b}.modal{width:min(600px,80vw);padding:24px;background:var(--ink);border:1px solid var(--gold)}.modal p{margin:14px 0}.modal button{margin-right:8px}.rotate{display:none}@media(max-width:959px){.app{min-width:960px}body{overflow-x:auto}}@media(max-height:650px){.app{grid-template-rows:52px 1fr 52px}.view{padding-top:10px;padding-bottom:10px}.companions{grid-template-rows:68px 1fr}.person img{height:50px;width:40px}.tabs{font-size:14px}.tabbody{padding:12px}.tile{min-height:85px}.tile.wide{min-height:95px}.home-menu{gap:10px}.home-menu h1{font-size:28px}}
</style>
</head>
<body>
<div class="sample">화면 구성 시안 · 표시 수치와 장비는 예시이며 게임에 저장되지 않습니다</div>
<div class="app">
<header class="top"><div class="brand">飛雷刀 <span style="font:16px system-ui;letter-spacing:0">비뢰도</span></div><span id="location" class="gold">강호 · 여정의 시작</span><div class="resources"><span>두 <b>99,999</b></span><span>하급 영석 <b>35</b></span><button id="homeButton" style="padding:3px 14px">강호로</button></div></header>
<main class="view">
<section id="home" class="home-grid">
<div class="hero-art"><img src="../../Assets/_Project/Resources/Art/Characters/player.png" alt="비류연"><div class="hero-caption"><span class="seal">검룡위 · 일검룡</span><h1>비류연</h1><p class="muted">강호를 걷는 비뢰도의 전승자</p></div></div>
<div class="home-menu"><div><small>협객의 길</small><h1>다시, 강호로</h1><p class="muted">여정과 동료의 성장을 한눈에 확인합니다.</p></div><div class="tiles"><button class="tile wide" data-preview="스테이지 선택"><strong>강호 출정</strong><small>스테이지 9 · 천무학관 운향정</small><span class="arrow">→</span></button><button class="tile" data-open="characters"><strong>협객</strong><small>상태 · 장비 · 수련 · 인연</small><span class="arrow">→</span></button><button class="tile" data-preview="무공과 심법"><strong>무공</strong><small>비전과 심법을 갈고닦습니다.</small></button><button class="tile" data-preview="행낭"><strong>행낭</strong><small>장비 돌파 · 분해 · 재료 합성</small></button><button class="tile" data-preview="기록"><strong>기록</strong><small>도감 · 이야기 · 전승의식</small></button></div><div class="quick"><button data-preview="의뢰">의뢰</button><button data-preview="무한 비무대">무한 비무대</button><button data-preview="파티 편성">파티 편성</button><button data-preview="뽑기">뽑기</button></div></div>
</section>
<section id="characters" class="companions hidden"><div id="roster" class="roster" aria-label="관리할 인물"></div><div class="workspace"><div class="hero-art"><img id="characterArt" alt="선택한 협객"><div class="hero-caption"><span id="role" class="seal"></span><h1 id="characterName"></h1><p id="identity" class="muted"></p></div></div><div class="manager"><div id="tabs" class="tabs" role="tablist"></div><div id="tabbody" class="tabbody"></div></div></div></section>
</main>
<nav class="nav" aria-label="주 메뉴"><button data-nav="home" class="active">강호</button><button data-nav="characters">협객</button><button data-preview="무공과 심법">무공</button><button data-preview="행낭">행낭</button><button data-preview="기록">기록</button></nav>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="modal" class="modal-back hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><button id="modalClose">닫기</button></div></div>
<script>
const art='../../Assets/_Project/Resources/Art/Characters/';
const people=[{id:'player',name:'비류연',role:'비뢰도 전승자',weapon:'강철 빨래방망이',train:0},{id:'hyo_ryong',name:'효룡',role:'쌍검 · 수비',weapon:'용아검',train:3},{id:'jang_hong',name:'장홍',role:'검 · 점혈',weapon:'월광검',train:4},{id:'yun_junho',name:'윤준호',role:'화산검 · 회복',weapon:'성락검',train:2},{id:'na_yerin',name:'나예린',role:'빙검 · 한기',weapon:'천룡검',train:3},{id:'im_seongjin',name:'임성진',role:'곤 · 연격',weapon:'참천도',train:1}];
const pages=['상태','장비','수련','무공','인연'];
const slots=['무기','상의','하의','신발','장신구 1','장신구 2'];
const items=[{name:'폭풍도',effect:'공격 +24% · 속도 +4',trait:'치명타 피해 +19.6%p',set:'폭풍 세트'},{name:'용아검',effect:'공격 +30% · 치명타 +6%p',trait:'내공 +9.8%',set:'용린 세트'},{name:'비뢰도 낙뢰',effect:'체력 +16% · 공격 +72%',trait:'치명타 피해 +32%p',set:'비뢰 세트'},{name:'성락검',effect:'공격 +40% · 속도 +5',trait:'치명타 피해 +32%p',set:'세트 없음'},{name:'참천도',effect:'공격 +45% · 치명타 +5%p',trait:'내공 +36%',set:'세트 없음'},{name:'월광검',effect:'공격 +28% · 내공 +8%',trait:'치명타 +1.5%p',set:'천룡 세트'}];
const otherItems={1:[{name:'용린 전갑',effect:'체력 +18% · 방어 +20%',trait:'내공 +9.8%',set:'용린 세트'},{name:'봉황 우의',effect:'체력 +16% · 속도 +3',trait:'내공 +9.8%',set:'봉황 세트'},{name:'천잠보의',effect:'체력 +25% · 방어 +18%',trait:'내공 +16%',set:'세트 없음'}],2:[{name:'용린 각반',effect:'체력 +12% · 방어 +15%',trait:'내공 +9.8%',set:'용린 세트'},{name:'천잠 장고',effect:'방어 +16% · 내공 +8%',trait:'체력 +9.8%',set:'세트 없음'},{name:'뇌령 비뢰고',effect:'방어 +18% · 속도 +4',trait:'내공 +16%',set:'비뢰 세트'}],3:[{name:'용족 신',effect:'속도 +5 · 방어 +10%',trait:'내공 +9.8%',set:'용린 세트'},{name:'천룡 비화',effect:'속도 +6 · 방어 +12%',trait:'체력 +9.8%',set:'천룡 세트'},{name:'비뢰 질보화',effect:'속도 +8 · 치명타 +4%p',trait:'내공 +16%',set:'비뢰 세트'}],4:[{name:'뇌금 묵뢰',effect:'내공 +35% · 체력 +10%',trait:'치명타 피해 +32%p',set:'비뢰 세트'},{name:'태극 옥패',effect:'내공 +20% · 방어 +10%',trait:'속도 +6',set:'세트 없음'},{name:'묵룡환',effect:'공격 +10% · 방어 +10%',trait:'돌파 추가 옵션 없음',set:'수련 시절 세트'}]};
function equipmentCandidates(){return slot===0?items:otherItems[Math.min(slot,4)]}
let selected=0,page='상태',slot=0,item=0,toastTimer;
function notify(text){const node=document.getElementById('toast');node.textContent=text;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),3500)}
function navigate(view){document.getElementById('home').classList.toggle('hidden',view!=='home');document.getElementById('characters').classList.toggle('hidden',view!=='characters');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));document.getElementById('location').textContent=view==='home'?'강호 · 여정의 시작':'협객 · '+people[selected].name;if(view==='characters')render()}
function preview(title){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').textContent='이 위치에서 기존 '+title+' 화면으로 연결합니다. 이번 시안에서는 협객의 인물 선택과 관리 탭, 장비 선택 동선을 확인할 수 있습니다.';document.getElementById('modal').classList.remove('hidden');document.getElementById('modalClose').focus()}
function render(){const p=people[selected];document.getElementById('location').textContent='협객 · '+p.name;document.getElementById('characterArt').src=art+p.id+'.png';document.getElementById('characterName').textContent=p.name;document.getElementById('role').textContent=p.role;document.getElementById('identity').textContent='Lv.24 · 성장 수치 예시';document.getElementById('roster').innerHTML=people.map((x,i)=>'<button class="person '+(i===selected?'active':'')+'" data-person="'+i+'" aria-pressed="'+(i===selected)+'"><img src="'+art+x.id+'.png" alt=""><span><strong>'+x.name+'</strong><small>'+(i===selected?'관리 중':'Lv.24')+'</small></span></button>').join('');document.getElementById('tabs').innerHTML=pages.map(x=>'<button role="tab" aria-selected="'+(x===page)+'" class="'+(x===page?'active':'')+'" data-page="'+x+'">'+x+'</button>').join('');const host=document.getElementById('tabbody');
if(page==='상태'){host.innerHTML='<div class="section-head"><h2>'+p.name+'의 상태</h2><span class="muted">장비 · 심법 효과 반영</span></div><div class="stats">'+[['체력','1,840'],['내공','420'],['공격력','540'],['방어력','310'],['속도','122'],['종합 수치','480']].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="note">인물을 바꿔도 현재 탭을 유지합니다. 장비와 수련을 보러 다른 메뉴로 이동할 필요가 없습니다.</div><div class="quick"><button data-page="장비">장비 살펴보기 →</button><button data-page="수련">성장 살펴보기 →</button></div>'}
else if(page==='장비'){const candidates=equipmentCandidates();item=Math.min(item,candidates.length-1);const chosen=candidates[item];host.innerHTML='<div class="setbar">현재 세트 효과 · 예시: 비뢰 2개 / 체력 +10%</div><div class="gear-columns"><div class="slots">'+slots.map((x,i)=>'<button class="'+(slot===i?'active':'')+'" data-slot="'+i+'">'+x+'<small>'+(i===0?p.weapon:'착용 장비')+'</small></button>').join('')+'</div><div><div class="section-head"><h3>보유 '+slots[slot]+'</h3><small>선택 → 우측 상세</small></div><div class="items">'+candidates.map((x,i)=>'<button class="item '+(i===item?'active':'')+'" data-item="'+i+'"><strong>'+x.name+'</strong><small>'+x.effect+'</small><small class="new">'+x.trait+'</small><small>'+x.set+'</small></button>').join('')+'</div></div><aside class="detail"><h3>'+chosen.name+'</h3><p class="muted">장비 상세정보 · 5성</p><p>'+chosen.effect+'</p><p class="new">돌파 옵션<br>'+chosen.trait+'</p><p>'+chosen.set+'</p><p class="muted">부위 강화 +20 / 상한 +100</p><button class="primary" data-demo="장비 선택 → 상세 확인 → 장착">장착</button><button data-demo="현재 착용 장비에서 부위 강화">부위 강화</button></aside></div>'}
else if(page==='수련'){if(selected===0){host.innerHTML='<h2>비류연의 성장</h2><div class="note">비류연은 전투 경험치·검룡위·심법으로 성장합니다. 동료에게 적용되는 두 수련을 새로 부여하지 않습니다.</div><div class="quick"><button data-preview="검룡위 승급">검룡위 승급</button><button data-preview="심법">심법 관리</button></div>'}else{host.innerHTML='<div class="section-head"><h2>'+p.name+'의 수련</h2><span class="gold">인연 · 신뢰</span></div><div class="training"><div class="training-box"><small>현재 수련 / 인연 상한</small><div class="level">'+p.train+' <small>/ 8</small></div><p>체력 · 공격 · 방어 +'+(p.train*4)+'%</p><div class="milestones"><span class="'+(p.train>=3?'done':'')+'">3단계<br>무공 강화</span><span>6단계<br>주력 무공 강화</span><span>10단계<br>각성</span></div></div><div class="training-box"><h3>다음 단계</h3><p>수련 '+(p.train+1)+'단계</p><p>체력 · 공격 · 방어 +4%</p><p class="muted">필요 두 · 비용 표시 위치</p><button class="primary" style="width:100%" data-demo="선택한 동료에게 수련을 적용하고 같은 화면에서 결과 확인">수련</button></div></div><div class="note">인연 상한에 도달하면 필요한 인연 단계와 인연 화면 바로가기를 표시합니다.</div>'}}
else if(page==='무공'){host.innerHTML='<div class="section-head"><h2>'+p.name+'의 무공</h2><small>'+(selected===0?'습득 · 장착 · 숙련':'고유 무공 · 해금 조건')+'</small></div>'+[selected===0?'비도 던지기':p.role.split(' · ')[0],'주력 무공','필살기'].map((x,i)=>'<div class="row"><span><strong>'+x+'</strong><br><small>'+(i===2?'기세 100 · 조건 표시':'효과 · 내공 · 재사용 대기 표시')+'</small></span><button data-demo="무공의 효과와 해금 조건 확인">상세</button></div>').join('')+'<div class="note">주인공의 무공 관리와 동료의 고유 무공 조회를 구분합니다.</div>'}
else {host.innerHTML='<h2>'+(selected===0?'동료와의 인연':p.name+'와의 인연')+'</h2>'+(selected===0?people.slice(1):[p]).map(x=>'<div class="row"><span>'+x.name+'<br><small>현재 인연 · 다음 단계 조건</small></span><strong class="gold">신뢰</strong></div>').join('')+'<div class="note">인연 효과 · 수련 상한 · 합공 정보를 같은 인물 기준으로 확인합니다.</div>'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)navigate(b.dataset.nav);else if(b.dataset.open)navigate(b.dataset.open);else if(b.dataset.person!==undefined){selected=Number(b.dataset.person);render()}else if(b.dataset.page){page=b.dataset.page;render()}else if(b.dataset.slot!==undefined){slot=Number(b.dataset.slot);render()}else if(b.dataset.item!==undefined){item=Number(b.dataset.item);render()}else if(b.dataset.preview)preview(b.dataset.preview);else if(b.dataset.demo)notify(b.dataset.demo+' · 동선 시안입니다. 게임 데이터는 바뀌지 않습니다.')});document.getElementById('homeButton').onclick=()=>navigate('home');document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.add('hidden');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.add('hidden')});
</script>
</body>
</html>
